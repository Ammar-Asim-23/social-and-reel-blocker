name: Native build checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.25.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test && pnpm check:native
      - run: python3 scripts/test_apk_permissions.py
      - run: pnpm exec expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: 1
      - name: Compile and test Android
        shell: bash
        run: |
          set -o pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew :unscroll-native:testDebugUnitTest :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon 2>&1 | tee ../android-build.log
      - name: Check release APK permissions
        run: python3 scripts/check-apk-permissions.py android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: android-build-diagnostics
          path: |
            android-build.log
            modules/unscroll/android/build/reports/tests/
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # macos-15 defaults to Xcode 16.4, below Expo SDK 55's requirement.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      EAS_BUILD_PLATFORM: ios
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify selected Apple toolchain
        run: xcodebuild -version && xcrun swift --version
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.25.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:native
      - run: pnpm exec expo prebuild --platform ios --no-install
        env:
          EXPO_NO_TELEMETRY: 1
      - run: cd ios && pod install
      - name: Compile iOS simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Unscroll.xcworkspace -scheme Unscroll -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -resultBundlePath ios-build.xcresult CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ios-build.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: ios-build-diagnostics
          path: |
            ios-build.log
            ios-build.xcresult
