name: Native build checks
on: [push, pull_request, workflow_dispatch]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test
      - run: pnpm exec expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: 1
      - run: chmod +x android/gradlew && cd android && ./gradlew :unscroll-native:testDebugUnitTest :app:assembleDebug -PreactNativeArchitectures=x86_64 --no-daemon
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec expo prebuild --platform ios --no-install
        env:
          EXPO_NO_TELEMETRY: 1
      - run: cd ios && pod install
      - run: xcodebuild -workspace ios/Unscroll.xcworkspace -scheme Unscroll -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
